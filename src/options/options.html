<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hunt-Ex — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo" aria-hidden="true">HX</div>
      <h1>Hunt-Ex — Settings</h1>
    </header>

    <section class="card">
      <label for="research-provider">Research provider (used to find public contact info for leads)</label>
      <select id="research-provider">
        <option value="openai">OpenAI (GPT)</option>
        <option value="exa">Exa.ai</option>
      </select>
      <p class="hint">
        LinkedIn's "Analyze with AI" step always uses the OpenAI key below, regardless of this
        selection — it doesn't do web research.
      </p>

      <div id="openai-key-fields">
        <label for="apikey-input">OpenAI API key</label>
        <input id="apikey-input" type="password" placeholder="sk-..." autocomplete="off" />
      </div>

      <div id="exa-key-fields" hidden>
        <label for="exa-apikey-input">Exa API key</label>
        <input id="exa-apikey-input" type="password" placeholder="Exa API key" autocomplete="off" />
      </div>

      <button id="apikey-test-btn" class="btn btn-ghost">Test key</button>
      <p id="apikey-test-status" class="status"></p>
    </section>

    <section class="card">
      <label for="storage-mode">Lead storage</label>
      <select id="storage-mode">
        <option value="local">Local (chrome.storage) — for testing</option>
        <option value="remote">Ecomdy internal backend/CRM</option>
      </select>

      <label for="backend-url">Backend URL</label>
      <input id="backend-url" type="text" placeholder="https://..." />

      <label for="backend-key">Backend API key</label>
      <input id="backend-key" type="password" placeholder="(if the backend requires auth)" />

      <button id="save-btn" class="btn btn-primary">Save</button>
      <p id="status" class="status"></p>
    </section>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
